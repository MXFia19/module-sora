# Publie la page d'installation autonome sur GitHub Pages.
#
# La page est un seul fichier HTML sans serveur : rien n'y scrape ni n'y
# proxifie, elle ne fait que fabriquer un lien dans le navigateur. C'est ce
# qui la rend hébergeable sur Pages, là où l'addon lui-même ne le serait pas.
#
# Avant le premier déploiement, une fois : Settings > Pages > Source =
# « GitHub Actions ». Sans ça le job échoue à la dernière étape.
name: Page d'installation

on:
  push:
    branches: [main]
    # Ne rebâtir que si la page ou ce qu'elle embarque a changé.
    paths:
      - 'stremio/src/configure.ts'
      - 'stremio/src/build-static.ts'
      - 'stremio/src/userconfig.ts'
      - 'stremio/src/scrapers/**'
      - 'stremio/package.json'
      - 'stremio/package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois ; on ne coupe pas celui en cours, sous peine de
# laisser Pages dans un état incohérent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stremio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stremio/package-lock.json

      - run: npm ci

      # Les tests portent aussi sur l'encodage de la configuration : une page
      # qui fabriquerait des liens illisibles par l'addon ne doit pas partir
      # en production.
      - run: npm test

      - run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stremio/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
