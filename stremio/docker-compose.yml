services:
  sora-stremio:
    build: .
    image: sora-stremio:latest
    container_name: sora-stremio
    restart: unless-stopped
    ports:
      - "${PORT:-7000}:7000"
    env_file:
      - .env
    environment:
      # Le port interne ne bouge pas ; c'est le mapping ci-dessus qui change.
      PORT: 7000
      # Journal de /debug/live, conservé d'un redémarrage à l'autre. Sans le
      # volume ci-dessous ce fichier partirait avec le conteneur : les deux
      # vont ensemble.
      LIVE_LOG_FILE: /data/journal.ndjson
    # Le cache des sources reste en mémoire — le perdre au redémarrage ne coûte
    # qu'une poignée de requêtes. Seul le journal mérite le disque : c'est
    # justement après un redémarrage qu'on veut relire ce qui a précédé.
    volumes:
      - sora_journal:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  sora_journal:
