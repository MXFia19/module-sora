# Déploiement public : addon + Caddy pour le HTTPS.
#
#   ADDON_DOMAIN=sora.exemple.fr docker compose -f docker-compose.public.yml up -d --build
#
# À utiliser à la place de docker-compose.yml (pas en plus). L'addon n'est PAS
# exposé directement : seul Caddy publie des ports, tout le reste passe par le
# réseau interne du compose.
services:
  sora-stremio:
    build: .
    image: sora-stremio:latest
    # Même nom que dans docker-compose.yml : le script d'auto-déploiement
    # détecte le fichier compose via ce conteneur, et le nom doit rester
    # stable quand on bascule du mode local au mode public.
    container_name: sora-stremio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 7000
      PUBLIC_URL: https://${ADDON_DOMAIN:?définir ADDON_DOMAIN}
      # Caddy est le seul intermédiaire : req.ip doit être l'IP réelle du
      # client, sinon la limite par IP s'applique à tout le monde en bloc.
      TRUST_PROXY: 1
      # Journal de /debug/live, conservé d'un redémarrage à l'autre (comme en
      # mode local). Va de pair avec le volume sora_journal ci-dessous.
      LIVE_LOG_FILE: /data/journal.ndjson
      # Valeurs de départ prudentes pour une instance ouverte, à ajuster selon
      # l'uplink de la machine (voir « Héberger publiquement » dans le README).
      RATE_LIMIT_STREAM_PER_MIN: ${RATE_LIMIT_STREAM_PER_MIN:-20}
      PROXY_MAX_CONCURRENT: ${PROXY_MAX_CONCURRENT:-15}
    expose:
      - "7000"
    volumes:
      - sora_journal:/data
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADDON_DOMAIN: ${ADDON_DOMAIN:?définir ADDON_DOMAIN}
      # Domaine d'AIOStreams (auto-hébergé, optionnel — voir le service
      # `aiostreams` plus bas). Défaut *.localhost : Caddy sert alors un vhost
      # à certificat local (aucun appel ACME public), inoffensif tant qu'on n'a
      # pas activé AIOStreams. Le vrai domaine se met dans .env.
      AIOSTREAMS_DOMAIN: ${AIOSTREAMS_DOMAIN:-aiostreams.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificats : à conserver, sinon Let's Encrypt
      - caddy_config:/config  # finit par limiter les demandes répétées
    depends_on:
      - sora-stremio
    # Pas de depends_on aiostreams : ce service est derrière un profile, et une
    # dépendance vers un service non activé ferait échouer le déploiement de
    # base. Caddy démarre seul ; il renvoie 502 sur le vhost AIOStreams tant que
    # le conteneur n'est pas là, ce qui n'arrive que si on a activé le profile.

  # ─── AIOStreams auto-hébergé (optionnel) ──────────────────────────────────
  # Désactivé par défaut. Pour l'activer, dans .env :
  #     COMPOSE_PROFILES=aiostreams
  #     AIOSTREAMS_DOMAIN=mxfia19aio.duckdns.org
  # et créer .env.aiostreams (voir .env.aiostreams.example) avec au minimum
  # SECRET_KEY et BASE_URL. Passe alors par le MÊME Caddy (HTTPS) que l'addon.
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    profiles: ["aiostreams"]
    # Fichier d'env SÉPARÉ : AIOStreams est du code tiers, il n'a rien à faire
    # avec les secrets de l'addon (TMDB_API_KEY, PROXY_SECRET, ADMIN_TOKEN...).
    # `required: false` : son absence ne casse pas le déploiement de base.
    env_file:
      - path: .env.aiostreams
        required: false
    expose:
      - "3000"
    volumes:
      - aiostreams_data:/app/data   # base SQLite : configs et addons persistés
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  sora_journal:
  aiostreams_data:
